<script>
// ---- 摸鱼协议接线 ----
var protocolPaused = false
function post(msg) { if (window.parent) { try { window.parent.postMessage(msg, '*') } catch (e) {} } }
function postReady() { post({ type: 'slack:ready', payload: { title: '中国象棋', version: 1 } }) }
function cloneMap(m) { return JSON.parse(JSON.stringify(m)) }
function serializeState() {
  return { map: cloneMap(play.map), pace: play.pace.slice(), my: play.my, depth: play.depth }
}
function postState() {
  var state = null
  try { state = serializeState() } catch (e) {}
  post({ type: 'slack:state', payload: { status: protocolPaused ? 'paused' : 'playing', state: state } })
}
function applyRestore(r) {
  if (!r || !Array.isArray(r.map)) return false
  var map = r.map
  for (var k in com.mans) com.mans[k].isShow = false
  for (var y = 0; y < map.length; y++) {
    if (!map[y]) continue
    for (var x = 0; x < map[y].length; x++) {
      var key = map[y][x]
      if (key && com.mans[key]) { com.mans[key].x = x; com.mans[key].y = y; com.mans[key].isShow = true }
    }
  }
  play.map = map
  play.pace = Array.isArray(r.pace) ? r.pace.slice() : []
  play.my = typeof r.my === 'number' ? r.my : 1
  if (typeof r.depth === 'number' && r.depth > 0) play.depth = r.depth
  play.nowManKey = false
  play.isPlay = true
  com.dot.dots = []
  com.pane.isShow = false
  com.show()
  if (play.my === -1) setTimeout(function () { if (!play.paused) play.AIPlay() }, 400)
  return true
}
function onInit(restore) {
  if (!applyRestore(restore)) { play.depth = 3; play.isPlay = true; play.init() }
  protocolPaused = false
  play.paused = false
  postReady()
  postState()
}
function onPause() { protocolPaused = true; play.paused = true; postState() }
function onResume() { protocolPaused = false; play.paused = false; if (play.pendingAI) { play.pendingAI = false; setTimeout(function () { play.AIPlay() }, 200) } postState() }
function onDestroy() { play.paused = true }
window.addEventListener('message', function (e) {
  var d = e.data
  if (!d || typeof d !== 'object') return
  if (d.type === 'slack:init') onInit(d.payload && d.payload.restore)
  else if (d.type === 'slack:pause') onPause()
  else if (d.type === 'slack:resume') onResume()
  else if (d.type === 'slack:destroy') onDestroy()
})
window.addEventListener('keydown', function (e) {
  if ((e.altKey || e.metaKey) && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); post({ type: 'slack:key', payload: { key: 'alt-m' } }) }
})
</script>
