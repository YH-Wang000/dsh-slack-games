<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>实验十六 使用 JavaScript 构建骰子游戏</title>
	<style>
	.container {
		width: 70%;
		margin: auto;
		text-align: center;
	}

	.dice {
		text-align: center;
		display: inline-block;
		margin: 10px;
	}

	body {
		background: #232931;
		background-size: 100% 100%;
		height: 95vh;
		margin: 0;
	}

	h1 {
		margin: 30px;
		font-family: "Lobster", cursive;
		text-shadow: 5px 0 #232931;
		font-size: 4.5rem;
		color: #4ecca3;
		text-align: center;
	}

	p {
		font-size: 2rem;
		color: #4ecca3;
		font-family: "Indie Flower", cursive;
	}

	img {
		width: 100%;
	}

	.bottom {
		padding-top: 30px;
	}

	.butn {
		background: #4ecca3;
		font-family: "Indie Flower", cursive;
		border-radius: 7px;
		color: #ffff;
		font-size: 30px;
		padding: 16px 25px 16px 25px;
		text-decoration: none;
	}

	.butn:hover {
		background: #232931;
		text-decoration: none;
	}
	.page-footer {
	  position: fixed;
	  right: 0;
	  bottom: 20px;
	  display: flex;
	  align-items: center;
	  padding: 5px;
	  color: black;
	  background: rgba(255, 255, 255, 0.65);
	}
	
	.page-footer a {
	  display: flex;
	  margin-left: 4px;
	}
	.touxiang{
		width:24px;
		height:24px;
	}
</style>

</head>

<body>
  <div class="container">
    <h1>让我们开始吧</h1>

    <div class="dice">
      <p class="Player1">玩家 1</p>
      <img class="img1" src="dice6.png">
    </div>

    <div class="dice">
      <p class="Player2">玩家 2</p>
      <img class="img2" src="dice6.png">
    </div>
  </div>

  <div class="container bottom">
    <button type="button" class="butn"
      onClick="rollTheDice()">
      掷骰子
    </button>
  </div>
  
  

<script>
// ---- 摸鱼协议接线 ----
var protocolPaused = false
function post(msg) { if (window.parent) { try { window.parent.postMessage(msg, '*') } catch (e) {} } }
function postReady() { post({ type: 'slack:ready', payload: { title: '骰子对决', version: 1 } }) }
function serializeState() {
  return {
    player1: player1, player2: player2,
    d1: document.querySelector('.img1').getAttribute('src'),
    d2: document.querySelector('.img2').getAttribute('src'),
    h1: document.querySelector('h1').innerHTML
  }
}
function postState() {
  var state = null
  try { state = serializeState() } catch (e) {}
  post({ type: 'slack:state', payload: { status: protocolPaused ? 'paused' : 'playing', state: state } })
}
function onInit(restore) {
  if (restore && typeof restore.player1 === 'string' && restore.player1 !== '') {
    player1 = restore.player1
    player2 = typeof restore.player2 === 'string' && restore.player2 !== '' ? restore.player2 : 'Player 2'
    document.querySelector('p.Player1').innerHTML = player1
    document.querySelector('p.Player2').innerHTML = player2
    if (typeof restore.d1 === 'string' && restore.d1.indexOf('dice') === 0) document.querySelector('.img1').setAttribute('src', restore.d1)
    if (typeof restore.d2 === 'string' && restore.d2.indexOf('dice') === 0) document.querySelector('.img2').setAttribute('src', restore.d2)
    if (typeof restore.h1 === 'string') document.querySelector('h1').innerHTML = restore.h1
  }
  protocolPaused = false
  paused = false
  postReady()
  postState()
}
function onPause() { protocolPaused = true; paused = true; postState() }
function onResume() { protocolPaused = false; paused = false; postState() }
function onDestroy() { /* 无长驻定时器 */ }
window.addEventListener('message', function (e) {
  var d = e.data
  if (!d || typeof d !== 'object') return
  if (d.type === 'slack:init') onInit(d.payload && d.payload.restore)
  else if (d.type === 'slack:pause') onPause()
  else if (d.type === 'slack:resume') onResume()
  else if (d.type === 'slack:destroy') onDestroy()
})
window.addEventListener('keydown', function (e) {
  if ((e.altKey || e.metaKey) && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); post({ type: 'slack:key', payload: { key: 'alt-m' } }) }
})
</script>
</body>
<script>
  // 玩家姓名
  var player1 = "Player 1";
  var player2 = "Player 2";
  var paused = false;



  // 掷骰子的功能
  function rollTheDice() {
    if (paused) return;
    setTimeout(function () {
      var randomNumber1 = Math.floor(Math.random() * 6) + 1;
      var randomNumber2 = Math.floor(Math.random() * 6) + 1;

      document.querySelector(".img1").setAttribute("src", "dice" + randomNumber1 + ".png");

      document.querySelector(".img2").setAttribute("src", "dice" + randomNumber2 + ".png");

      if (randomNumber1 === randomNumber2) {
        document.querySelector("h1").innerHTML = "平局!";
      } else if (randomNumber1 < randomNumber2) {
        document.querySelector("h1").innerHTML = (player2 + "获得胜利!");
      } else {
        document.querySelector("h1").innerHTML = (player1 + "获得胜利!");
      }
      postState && postState();
    }, 1000);
  }
</script>

</html>
